<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; }
header {
  display:flex; justify-content:space-between; align-items:center;
  background:#1a237e; padding:12px; color:white;
}
.comment-section { padding:15px; }
.comment {
  background:#f1f1f1; padding:10px;
  margin-top:10px; border-radius:6px;
}
.cookie-box {
  text-align:center;
  margin-top:20px;
}
.cookie-btn {
  padding:10px 20px;
  font-size:16px;
  cursor:pointer;
}
#cookieVisual {
  margin-top:10px;
  font-size:24px;
  word-wrap: break-word;
}
</style>
</head>

<body>

<header>
  <div>塩と銅</div>
</header>

<div class="comment-section">
  <textarea id="commentInput"></textarea><br>
  <button onclick="postComment()">投稿</button>
  <div id="commentList"></div>
</div>

<div class="cookie-box">
  <h2>🍪 クッキー: <span id="cookieCount">0</span></h2>
  <button class="cookie-btn" onclick="addCookie()">クッキーを焼く🍪</button>
  <div id="cookieVisual"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyXXXX",
  authDomain: "XXXX.firebaseapp.com",
  projectId: "XXXX"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ===== コメント投稿 =====
function postComment(){
  let input=document.getElementById("commentInput");
  let text=input.value.trim();
  if(!text)return;

  db.collection("comments").add({
    text:text,
    time:Date.now(),
    report:0
  });

  input.value="";
}

// ===== コメント表示 =====
function loadComments(){
  db.collection("comments")
  .orderBy("time","desc")
  .onSnapshot(snapshot=>{
    let list=document.getElementById("commentList");
    list.innerHTML="";

    snapshot.forEach(doc=>{
      let c=doc.data();

      let div=document.createElement("div");
      div.className="comment";

      let text = document.createElement("div");
      text.textContent = c.text;
      div.appendChild(text);

      if(c.text.includes("☺️")){
        let btn = document.createElement("button");
        btn.textContent = "追放 (" + (c.report || 0) + "/10)";

        btn.onclick = ()=>{
          let newCount = (c.report || 0) + 1;

          if(newCount >= 10){
            db.collection("comments").doc(doc.id).delete();
          }else{
            db.collection("comments").doc(doc.id).update({
              report: newCount
            });
          }
        };

        div.appendChild(btn);
      }

      list.appendChild(div);
    });
  });
}
loadComments();

// ===== クッキー =====
const cookieRef = db.collection("counts").doc("cookie");

// ★ 強制復旧（なければ作る）
cookieRef.get().then(doc=>{
  if(!doc.exists){
    cookieRef.set({count:0});
  }
});

function addCookie(){
  cookieRef.update({
    count: firebase.firestore.FieldValue.increment(1)
  });
}

function renderCookies(count){
  let box = document.getElementById("cookieVisual");
  box.innerHTML = "";

  for(let i=0; i<count; i++){
    let span = document.createElement("span");
    span.textContent = "🍪";
    box.appendChild(span);
  }
}

cookieRef.onSnapshot(doc=>{
  if(doc.exists){
    let count = doc.data().count;
    document.getElementById("cookieCount").textContent = count;
    renderCookies(count);
  }
});
</script>

</body>
</html>
