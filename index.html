<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; }

header {
  display:flex; justify-content:space-between; align-items:center;
  background:#1a237e; padding:12px; color:white;
}

.comment-section { padding:15px; }

textarea {
  width:100%;
  height:60px;
}

.comment {
  background:#f1f1f1;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
}

.cookie-box {
  text-align:center;
  margin-top:20px;
}

.cookie-btn {
  padding:10px 20px;
  font-size:16px;
  cursor:pointer;
}

#cookieVisual {
  margin-top:10px;
  font-size:24px;
  word-wrap: break-word;
}
</style>
</head>

<body>

<header>
  <div>塩と銅</div>
</header>

<div class="comment-section">
  <textarea id="commentInput" placeholder="コメントを書く"></textarea><br>
  <button onclick="postComment()">投稿</button>
  <div id="commentList"></div>
</div>

<div class="cookie-box">
  <h2>🍪 クッキー: <span id="cookieCount">0</span></h2>
  <button class="cookie-btn" onclick="addCookie()">クッキーを焼く🍪</button>
  <div id="cookieVisual"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
// ===== Firebase設定（必ず自分のにする）=====
const firebaseConfig = {
  apiKey: "AIzaSyCAgrvrjt4jvKGi85l_FKZw_ErhaOEicq8",
  authDomain: "ikuze-15962.firebaseapp.com",
  projectId: "ikuze-15962",
  storageBucket: "ikuze-15962.firebasestorage.app",
  messagingSenderId: "447043429205",
  appId: "1:447043429205:web:11e4227749a536afd545dc"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ===== コメント投稿 =====
function postComment(){
  let input = document.getElementById("commentInput");
  let text = input.value.trim();
  if(!text) return;

  db.collection("comments").add({
    text: text,
    time: Date.now(),
    report: 0
  })
  .then(() => {
    input.value = "";
  })
  .catch(err => {
    alert("投稿失敗: " + err.message);
    console.error(err);
  });
}

// ===== コメント表示（リアルタイム）=====
function loadComments(){
  db.collection("comments")
  .orderBy("time","desc")
  .onSnapshot(snapshot => {

    let list = document.getElementById("commentList");
    list.innerHTML = "";

    snapshot.forEach(doc => {
      let c = doc.data();

      let div = document.createElement("div");
      div.className = "comment";

      let text = document.createElement("div");
      text.textContent = c.text;
      div.appendChild(text);

      // ☺️コメントのみ通報
      if(c.text.includes("☺️")){
        let btn = document.createElement("button");
        btn.textContent = "追放 (" + (c.report || 0) + "/10)";

        btn.onclick = () => {
          let newCount = (c.report || 0) + 1;

          if(newCount >= 10){
            db.collection("comments").doc(doc.id).delete();
          }else{
            db.collection("comments").doc(doc.id).update({
              report: newCount
            });
          }
        };

        div.appendChild(btn);
      }

      list.appendChild(div);
    });

  }, error => {
    alert("コメント取得失敗");
    console.error(error);
  });
}
loadComments();

// ===== クッキー =====
const cookieRef = db.collection("counts").doc("cookie");

// クッキー追加
function addCookie(){
  cookieRef.set({
    count: firebase.firestore.FieldValue.increment(1)
  }, { merge: true })
  .catch(err => {
    alert("クッキー失敗: " + err.message);
    console.error(err);
  });
}

// クッキー描画
function renderCookies(count){
  let box = document.getElementById("cookieVisual");
  box.innerHTML = "";

  let max = Math.min(count, 100);

  for(let i=0; i<max; i++){
    let span = document.createElement("span");
    span.textContent = "🍪";
    box.appendChild(span);
  }

  if(count > 100){
    let more = document.createElement("div");
    more.textContent = "他 " + (count - 100) + " 個...";
    box.appendChild(more);
  }
}

// リアルタイム同期
cookieRef.onSnapshot(doc => {
  let count = 0;

  if(doc.exists && doc.data().count){
    count = doc.data().count;
  }

  document.getElementById("cookieCount").textContent = count;
  renderCookies(count);

}, error => {
  alert("クッキー取得失敗");
  console.error(error);
});
</script>

</body>
</html>
