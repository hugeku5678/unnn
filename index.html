<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; }

/* ヘッダー */
header {
  display:flex; justify-content:space-between; align-items:center;
  background:#1a237e; padding:12px; color:white;
}

/* コメント */
.comment-section { padding:15px; }
.comment {
  background:#f1f1f1; padding:10px;
  margin-top:10px; border-radius:6px;
}

/* クッキー */
.cookie-box {
  text-align:center;
  margin-top:20px;
}
.cookie-btn {
  padding:10px 20px;
  font-size:16px;
  cursor:pointer;
}

/* クッキー表示 */
#cookieVisual {
  margin-top:10px;
  font-size:24px;
  word-wrap: break-word;
}
</style>
</head>

<body>

<header>
  <div>塩と銅</div>
</header>

<!-- コメント -->
<div class="comment-section">
  <textarea id="commentInput"></textarea><br>
  <button onclick="postComment()">投稿</button>
  <div id="commentList"></div>
</div>

<!-- クッキー -->
<div class="cookie-box">
  <h2>🍪 クッキー: <span id="cookieCount">0</span></h2>
  <button class="cookie-btn" onclick="addCookie()">クッキーを焼く🍪</button>

  <!-- 絵文字表示 -->
  <div id="cookieVisual"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
// ===== Firebase設定 =====
const firebaseConfig = {
  apiKey: "AIzaSyCAgrvrjt4jvKGi85l_FKZw_ErhaOEicq8",
  authDomain: "ikuze-15962.firebaseapp.com",
  projectId: "ikuze-15962",
  storageBucket: "ikuze-15962.firebasestorage.app",
  messagingSenderId: "447043429205",
  appId: "1:447043429205:web:11e4227749a536afd545dc"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ===== コメント投稿 =====
function postComment(){
  let input=document.getElementById("commentInput");
  let text=input.value.trim();
  if(!text)return;

  db.collection("comments").add({
    text:text,
    time:Date.now()
  });

  input.value="";
}

// ===== コメント表示 =====
function loadComments(){
  db.collection("comments")
  .orderBy("time","desc")
  .onSnapshot(snapshot=>{
    let list=document.getElementById("commentList");
    list.innerHTML="";

    snapshot.forEach(doc=>{
      let c=doc.data();

      let div=document.createElement("div");
      div.className="comment";
      div.textContent = c.text;

      list.appendChild(div);
    });
  });
}
loadComments();

// ===== クッキーカウンター =====
const cookieRef = db.collection("counts").doc("cookie");

// 初期作成
cookieRef.get().then(doc=>{
  if(!doc.exists){
    cookieRef.set({count:0});
  }
});

// 増やす
function addCookie(){
  cookieRef.update({
    count: firebase.firestore.FieldValue.increment(1)
  });
}

// 🍪表示（制限なし）
function renderCookies(count){
  let box = document.getElementById("cookieVisual");
  box.innerHTML = "";

  for(let i=0; i<count; i++){
    let span = document.createElement("span");
    span.textContent = "🍪";
    box.appendChild(span);
  }
}

// リアルタイム更新
cookieRef.onSnapshot(doc=>{
  if(doc.exists){
    let count = doc.data().count;

    document.getElementById("cookieCount").textContent = count;

    renderCookies(count);
  }
});
</script>

</body>
</html>
