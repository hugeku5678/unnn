<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; }

/* ヘッダー */
header {
  display:flex; justify-content:space-between; align-items:center;
  background:#1a237e; padding:12px; color:white;
}
.icon { width:22px; stroke:white; fill:none; stroke-width:2; cursor:pointer; }
.right { display:flex; gap:15px; }

/* メニュー */
.menu {
  position:fixed; top:0; right:0; width:250px; height:100%;
  background:#222; color:white; padding:20px;
  transform:translateX(100%); transition:0.3s;
}
.menu.open { transform:translateX(0); }

.overlay {
  position:fixed; width:100%; height:100%;
  background:rgba(0,0,0,0.5); display:none;
}
.overlay.show { display:block; }

/* 検索 */
.search-modal {
  position:fixed; width:100%; height:100%;
  background:white; display:none; padding:20px;
}
.search-modal.show { display:block; }

/* 画像 */
.main-image { width:100%; height:300px; object-fit:cover; }

/* 記事 */
.articles {
  display:grid; grid-template-columns:1fr 1fr;
  gap:10px; padding:10px;
}
.article { background:#eee; border-radius:8px; overflow:hidden; }
.article img { width:100%; height:120px; object-fit:cover; }
.article h3 { margin:8px; }

/* コメント */
.comment-section { padding:15px; }
.comment {
  background:#f1f1f1; padding:10px;
  margin-top:10px; border-radius:6px;
}

/* ゲーム */
#game {
  display:block; margin:30px auto;
  background:#111; border:2px solid #333;
}
</style>
</head>

<body>

<header>
  <div>塩と銅</div>
</header>

<!-- コメント -->
<div class="comment-section">
  <textarea id="commentInput"></textarea><br>
  <button onclick="postComment()">投稿</button>
  <div id="commentList"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
// ===== Firebase設定 =====
const firebaseConfig = {
  apiKey: "AIzaSyCAgrvrjt4jvKGi85l_FKZw_ErhaOEicq8",
  authDomain: "ikuze-15962.firebaseapp.com",
  projectId: "ikuze-15962",
  storageBucket: "ikuze-15962.firebasestorage.app",
  messagingSenderId: "447043429205",
  appId: "1:447043429205:web:11e4227749a536afd545dc"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ===== 投稿 =====
function postComment(){
  let input=document.getElementById("commentInput");
  let text=input.value.trim();
  if(!text)return;

  db.collection("comments").add({
    text:text,
    poop:0,
    time:Date.now()
  });

  input.value="";
}

// ===== 表示（超シンプル版） =====
function loadComments(){
  db.collection("comments")
  .onSnapshot(snapshot=>{
    let list=document.getElementById("commentList");
    list.innerHTML="";

    snapshot.forEach(doc=>{
      let c=doc.data();

      let div=document.createElement("div");
      div.className="comment";
      div.textContent = c.text;

      list.appendChild(div);
    });
  });
}
loadComments();
</script>

</body>
</html>
